<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Current Data</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; background-color: #f0f0f5; }
        #display { background: white; padding: 20px; border: 2px solid #000; max-width: 800px; margin: 0 auto; }
        
         .floating-action-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); padding: 20px; border-top: 1px solid #c6c6c8; z-index: 9999; display: flex; gap: 10px; justify-content: center; }
        .floating-action-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 30px; border-top: 1px solid #c6c6c8; z-index: 9999; display: flex; gap: 10px; justify-content: center; }
        .action-btn { flex: 1; border: none; border-radius: 28px; padding: 30px 5px; font-weight: 700; font-size: 40px; color: white; cursor: pointer; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .btn-print { background-color: #007aff; }
        .btn-clear { background-color: #ff3b30; }
        .btn-back { background-color: #8e8e93; }

        /* Print Optimization */
        @media print {
            .floating-action-panel { display: none !important; }
            body { background: white; padding: 0; }
            #display { border: none; }
        }
    </style>
</head>
<body>

    <div id="display"><h1>Loading data...</h1></div>

    <div class="floating-action-panel">
        <button class="action-btn btn-back" onclick="window.location.href='../index.html'">Back</button>
        <button class="action-btn btn-print" onclick="window.print()">Print / Save PDF</button>
    </div>

    <script>
        const GIST_ID = "d0511895caedad56507d83f23b72b850"; // Replace with your ID

        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                const data = await res.json();
                const workbook = JSON.parse(data.files['data.json'].content);
                const container = document.getElementById('display');
                container.innerHTML = '';
                
                workbook.SheetNames.forEach(name => {
                    const html = XLSX.utils.sheet_to_html(workbook.Sheets[name]);
                    container.innerHTML += `<h3>${name}</h3><div>${html}</div>`;
                });
            } catch (err) {
                document.getElementById('display').innerHTML = "No data available.";
            }
        }
        loadData();
    </script>
</body>
</html>
