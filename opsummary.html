<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Journal</title>
    <style>
        /* This is the standard command to force landscape mode */
        @page { 
            size: landscape; 
            margin: 5mm; 
        }
        
        body { font-family: sans-serif; margin: 10px; color: black; }
        
        .name-row { display: flex; align-items: baseline; margin-bottom: 5px; }
        .name-row label { font-weight: bold; margin-right: 6px; font-size: 9pt; white-space: nowrap; }
        .name-row input { 
            flex-grow: 1; border: none; border-bottom: 1px solid #000; 
            padding: 1px 0 1px 5px; font-size: 9pt; background: transparent; 
            color: #000; font-family: sans-serif; 
        }

        table { 
            width: 100%; border-collapse: collapse; 
            table-layout: fixed; border: 1px solid #333; color: black; 
        }
        td { border: 1px solid #333; padding: 0; height: 32px; vertical-align: top; }
        
        textarea { 
            width: 100%; height: 100%; border: none; 
            padding: 1px; box-sizing: border-box; outline: none; 
            font-size: 8px; font-weight: bold; color: black; 
            background-color: transparent; font-style: italic; 
            text-align: left; resize: none; overflow: hidden;
            font-family: sans-serif;
        }

        select { 
            border: none; padding: 0; font-size: 8px; 
            font-weight: bold; background-color: transparent;
            font-style: italic; cursor: pointer; color: black;
            width: 48%; -webkit-appearance: none; appearance: none;
        }

        .date-cell-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        
        th { 
            border: 1px solid #333; padding: 2px; background-color: transparent; 
            text-align: center; font-size: 8px; height: 20px; color: black; 
        }
        .journal-cell { text-align: center; font-weight: bold; font-size: 9px; height: 18px; background: transparent; }
        .day-label { 
            font-weight: bold; width: 80px; font-size: 8px; height: 35px; 
            color: black; text-align: center; line-height: 35px;
            vertical-align: middle; box-sizing: border-box;
        }
         
        .floating-action-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 20px; border-top: 1px solid #c6c6c8; z-index: 9999; display: flex; gap: 10px; justify-content: center; }
        .action-btn { border: none; border-radius: 20px; padding: 15px 30px; font-weight: 700; font-size: 16px; color: white; cursor: pointer; }
        .btn-print { background-color: #007aff; }
        .btn-clear { background-color: #ff3b30; }
        .btn-back { background-color: #8e8e93; }
        
        @media print { 
            .floating-action-panel { display: none !important; } 
        }
    </style>
</head>
<body>
    
    <div class="name-row"><label>NAME:</label><input type="text" id="user-name"></div>

    <table>
        <colgroup>
            <col style="width: 60px;"><col style="width: 80px;"><col style="width: 70px;"><col style="width: 70px;">
            <col style="width: 70px;"><col style="width: 70px;"><col style="width: 70px;"><col style="width: auto;">
        </colgroup>
        <thead>
            <tr>
                <th>Date</th><th>Activity/Location</th><th>Plan Start</th><th>Plan Qty</th>
                <th>Actual Start</th><th>Actual End</th><th>Actual Qty</th><th>Comments</th>
            </tr>
        </thead>
        <tbody id="grid-body"></tbody>
    </table>

    <div class="floating-action-panel">
        <button type="button" class="action-btn btn-back" onclick="window.location.href='index.html'">Back</button>
        <button type="button" class="action-btn btn-clear" onclick="clearAllData()">Clear</button>
        <button type="button" class="action-btn btn-print" onclick="window.print()">Print</button>
    </div>

    <script>
        const tbody = document.getElementById('grid-body');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        for (let i = 0; i < 7; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 8; j++) {
                let cell = document.createElement('td');
                if (j === 0) {
                    cell.innerHTML = `<div class="date-cell-container"><select id="r${i}m"><option value=""></option>${months.map(m=>`<option value="${m}">${m}</option>`).join('')}</select><select id="r${i}d"><option value=""></option>${Array.from({length:31}, (_,k)=>`<option value="${k+1}">${k+1}</option>`).join('')}</select></div>`;
                } else {
                    cell.innerHTML = `<textarea class="cell-input" id="r${i}c${j}"></textarea>`;
                }
                row.appendChild(cell);
            }
            tbody.appendChild(row);
        }

        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        tbody.innerHTML += `<tr><td colspan="8" class="journal-cell">Daily Journal</td></tr>`;
        days.forEach((day, i) => {
            tbody.innerHTML += `<tr><td class="day-label">${day}</td><td colspan="7"><textarea class="cell-input" id="journal${i}"></textarea></td></tr>`;
        });

        function saveData() {
            let data = {};
            document.querySelectorAll('textarea, select, input').forEach(el => data[el.id] = el.value);
            localStorage.setItem('journalData', JSON.stringify(data));
        }
        document.addEventListener('input', saveData);
        document.addEventListener('change', saveData);

        function loadData() {
            let saved = JSON.parse(localStorage.getItem('journalData'));
            if (saved) Object.keys(saved).forEach(id => {
                let el = document.getElementById(id);
                if (el) el.value = saved[id];
            });
        }
        window.onload = loadData;
        
        function clearAllData() {
            if(confirm("Clear all data?")) {
                localStorage.removeItem('journalData');
                location.reload();
            }
        }
    </script>
</body>
</html>
